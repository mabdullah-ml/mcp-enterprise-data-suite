services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
      POSTGRES_DB: enterprise_analytics
    ports:
      - "5432:5432"

  python-mcp-gateway:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MCP_DB_URL: sqlite:///./enterprise_demo.db
      MCP_MAX_SQL_ROWS: "200"
    depends_on:
      - postgres

  ts-ops-mcp:
    build:
      context: ./typescript
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
